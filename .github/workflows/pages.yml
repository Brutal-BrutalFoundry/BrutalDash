name: Publish BrutalDash catalog

on:
  push:
    branches: [main]
    paths:
      - 'store/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked release ZIPs
        shell: bash
        run: |
          if git ls-files -- '*.zip' | grep -q .; then
            echo "::error::Release ZIPs must be GitHub Release assets, not tracked in the source repository."
            git ls-files -- '*.zip'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: store
      - id: deployment
        uses: actions/deploy-pages@v4
